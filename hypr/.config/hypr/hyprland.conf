input {
	kb_layout =dk 
	}

monitor = DP-2, 1920x1080@144, 0x0, 1, transform, 1
monitor = DP-3, 2560x1440@239.76, 1080x240, 1
monitor = DP-1, 2560x1440@239.96, 3640x240, 1 


$mod = SUPER 
$terminal = wezterm start --always-new-process
$menu = rofi -show drun 

dwindle {
	preserve_split = true
}

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_Desktop,Hyprland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = waybar
exec-once = swaync
exec-once = awww-daemon
exec-once = sh -c 'sleep 0.5; awww img ~/Pictures/Wallpapers/mich-tokyonight/PixelartCity.png --resize crop --filter Nearest'
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $menu
bind = $mod, B, exec, google-chrome-stable
bind = $mod, Y, exec, brave https://www.youtube.com
bind = $mod, Q, killactive
bind = $mod SHIFT, Q, exec, ~/.config/hypr/scripts/close-all-clients.sh
bind = $mod, F, fullscreen
bind = $mod, M, exec, ~/.config/hypr/scripts/exit-if-empty.sh
bind = $mod, V, togglefloating
bind = $mod SHIFT, Escape, exit

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, layoutmsg, togglesplit
bind = $mod SHIFT, R, layoutmsg, swapsplit

bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, L, focusmonitor, r
bind = $mod CTRL SHIFT, H, movewindow, mon:l
bind = $mod CTRL SHIFT, L, movewindow, mon:r
bind = $mod CTRL SHIFT, F, resizeactive, exact 90% 90%
bind = $mod CTRL SHIFT, C, centerwindow, 1
bind = $mod CTRL SHIFT, M, exec, hyprctl --batch "keyword monitor DP-3,disable; keyword monitor DP-1,2560x1440@239.96,1080x240,1"
bind = $mod CTRL ALT, M, exec, hyprctl --batch "keyword monitor DP-3,2560x1440@239.76,1080x240,1; keyword monitor DP-1,2560x1440@239.96,3640x240,1"

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, N, workspace, +1
bind = $mod, P, workspace, -1

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, N, movetoworkspace, +1
bind = $mod SHIFT, P, movetoworkspace, -1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = ,Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mod SHIFT, C, exec, swaync-client -C

bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMute, exec, pamixer -t 

bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind =, XF86MonBrightnessUp, exec, brightnessctl set +10%
bind =, XF86MonBrightnessDown, exec, brightnessctl set 10%-
